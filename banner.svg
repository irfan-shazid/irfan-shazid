<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 375" width="1200" height="375" role="img" aria-label="Irfan Shazid, Full Stack Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glowBlue" cx="0.82" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.97" cy="0.95" r="0.35">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#2563eb" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Inter, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: Consolas, 'SF Mono', Menlo, 'JetBrains Mono', 'Liberation Mono', monospace; font-size: 17px; }
    .pill { font-size: 19px; font-weight: 700; text-anchor: middle; }
  </style>

  <!-- background -->
  <rect width="1200" height="375" fill="#070b16"/>
  <rect width="1200" height="375" fill="url(#glowBlue)"/>
  <rect width="1200" height="375" fill="url(#glowPurple)"/>

  <!-- left column -->
  <rect x="64" y="78" width="3" height="240" rx="1.5" fill="#3b82f6" opacity="0.85"/>
  <text x="92" y="146" class="sans" font-size="52" font-weight="800" fill="#38bdf8">Irfan Shazid</text>
  <text x="92" y="193" class="sans" font-size="25" font-weight="600" fill="#f8fafc">Full Stack Engineer</text>
  <text x="92" y="242" class="sans" font-size="17" fill="#94a3b8">Building scalable web apps with modern technologies.</text>

  <!-- tech pill bar -->
  <rect x="92" y="268" width="596" height="64" rx="16" fill="#0d1424" stroke="#1e293b" stroke-width="1.5" filter="url(#softGlow)"/>
  <g class="sans">
    <text x="126" y="308" class="pill" fill="#facc15">JS</text>
    <text x="176"   y="308" class="pill" fill="#38bdf8">TS</text>
    <text x="246"   y="308" class="pill" fill="#61dafb">React</text>
    <text x="338"   y="308" class="pill" fill="#ffffff">Next.js</text>
    <text x="438"   y="308" class="pill" fill="#22c55e">Node.js</text>
    <text x="536"   y="308" class="pill" fill="#4b8bbe">Python</text>
    <text x="630"   y="308" class="pill" fill="#44b78b">Django</text>
  </g>

  <!-- code window -->
  <rect x="724" y="52" width="446" height="272" rx="20" fill="#030712" stroke="#1e3a5f" stroke-width="1.5" filter="url(#softGlow)"/>
  <circle cx="754" cy="86" r="7" fill="#fb7185"/>
  <circle cx="778" cy="86" r="7" fill="#facc15"/>
  <circle cx="802" cy="86" r="7" fill="#4ade80"/>

  <g class="mono" xml:space="preserve">
    <text x="756" y="132"><tspan fill="#38bdf8">const developer</tspan><tspan fill="#60a5fa"> = {</tspan></text>
    <text x="796" y="165"><tspan fill="#a78bfa">role: </tspan><tspan fill="#c4b5fd">"Full Stack"</tspan><tspan fill="#a78bfa">,</tspan></text>
    <text x="796" y="198"><tspan fill="#4ade80">stack: ["MERN", "PERN", "Django"],</tspan></text>
    <text x="796" y="231"><tspan fill="#fbbf24">langs: ["JS", "TS", "Python"],</tspan></text>
    <text x="796" y="264"><tspan fill="#f472b6">learning: </tspan><tspan fill="#f9a8d4">["Next.js", "TypeScript"]</tspan></text>
    <text x="756" y="297" fill="#60a5fa">}</text>
  </g>
</svg>
