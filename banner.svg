<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Irfan Shazid, Full Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 21px; }
    .ln   { fill: #3b4261; text-anchor: end; }
    .kw   { fill: #bb9af7; }
    .var  { fill: #c0caf5; }
    .prop { fill: #73daca; }
    .str  { fill: #9ece6a; }
    .new  { fill: #e0af68; }
    .pun  { fill: #89ddff; }
    .fn   { fill: #7aa2f7; }
    .cm   { fill: #565f89; font-style: italic; }
    .tab  { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 15px; fill: #a9b1d6; }
    .cursor { fill: #c0caf5; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>

  <!-- background -->
  <rect width="1200" height="340" rx="18" fill="#1a1b26"/>

  <!-- title bar -->
  <path d="M0 18 Q0 0 18 0 H1182 Q1200 0 1200 18 V48 H0 Z" fill="#16161e"/>
  <circle cx="30" cy="24" r="7" fill="#f7768e"/>
  <circle cx="54" cy="24" r="7" fill="#e0af68"/>
  <circle cx="78" cy="24" r="7" fill="#9ece6a"/>
  <rect x="112" y="8" width="130" height="40" rx="6" fill="#1a1b26"/>
  <text x="130" y="33" class="tab">irfan.ts</text>
  <text x="1170" y="33" class="tab" text-anchor="end" fill="#565f89" style="fill:#565f89">github.com/shazid25</text>

  <g class="code" xml:space="preserve">
    <text x="48" y="92"  class="ln">1</text>
    <text x="48" y="124" class="ln">2</text>
    <text x="48" y="156" class="ln">3</text>
    <text x="48" y="188" class="ln">4</text>
    <text x="48" y="220" class="ln">5</text>
    <text x="48" y="252" class="ln">6</text>
    <text x="48" y="284" class="ln">7</text>
    <text x="48" y="316" class="ln">8</text>

    <text x="72" y="92"><tspan class="kw">const</tspan><tspan class="var"> irfan </tspan><tspan class="pun">= {</tspan></text>
    <text x="72" y="124"><tspan class="prop">  name</tspan><tspan class="pun">: </tspan><tspan class="str">"Irfan Shazid"</tspan><tspan class="pun">,</tspan></text>
    <text x="72" y="156"><tspan class="prop">  role</tspan><tspan class="pun">: </tspan><tspan class="str">"Full Stack Developer"</tspan><tspan class="pun">,</tspan></text>
    <text x="72" y="188"><tspan class="prop">  stack</tspan><tspan class="pun">: [</tspan><tspan class="str">"React"</tspan><tspan class="pun">, </tspan><tspan class="str">"Next.js"</tspan><tspan class="pun">, </tspan><tspan class="str">"Node.js"</tspan><tspan class="pun">, </tspan><tspan class="str">"Express"</tspan><tspan class="pun">, </tspan><tspan class="str">"TypeScript"</tspan><tspan class="pun">,</tspan></text>
    <text x="72" y="220"><tspan class="var">          </tspan><tspan class="new">"Python"</tspan><tspan class="pun">, </tspan><tspan class="new">"Django"</tspan><tspan class="pun">, </tspan><tspan class="str">"MongoDB"</tspan><tspan class="pun">, </tspan><tspan class="str">"PostgreSQL"</tspan><tspan class="pun">],</tspan></text>
    <text x="72" y="252"><tspan class="prop">  learning</tspan><tspan class="pun">: [</tspan><tspan class="str">"System Design"</tspan><tspan class="pun">, </tspan><tspan class="str">"Golang"</tspan><tspan class="pun">],</tspan></text>
    <text x="72" y="284"><tspan class="pun">};</tspan><tspan class="cm">  // open to open-source collabs</tspan></text>
    <text x="72" y="316"><tspan class="var">irfan</tspan><tspan class="pun">.</tspan><tspan class="fn">build</tspan><tspan class="pun">();</tspan></text>
  </g>
  <rect x="256" y="298" width="12" height="24" class="cursor"/>
